[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nyxwin"
version = "1.0.0"
description = "Native iOS Toolchain & IPA Builder for Windows (No macOS & No WSL)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Abdo AT", email = "abdoat@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Compilers"
]
dependencies = [
    "pillow>=9.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.urls]
Homepage = "https://github.com/xAbdoAT/NyxWin"
Repository = "https://github.com/xAbdoAT/NyxWin"
Issues = "https://github.com/xAbdoAT/NyxWin/issues"

[project.scripts]
nyx = "nyxwin.cli:main"
nyxwin = "nyxwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]

[tool.setuptools.package-data]
nyxwin = [
    "resources/**/*"
]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "timeout: test timeout",
]
